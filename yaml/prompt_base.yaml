  birth_data:
    date: "<Дата рождения>"
    time: "<Время рождения>"
    place: "<Место рождения>"
  planets:
    Sun: "<Знак и градус>"
    Moon: "<Знак и градус>"
    Mercury: "<Знак и градус>"
    Venus: "<Знак и градус>"
    Mars: "<Знак и градус>"
    Jupiter: "<Знак и градус>"
